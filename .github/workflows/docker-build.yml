on:
  workflow_call:
    inputs:
      build-args:
        type: string
        required: false
        default: |
          GITHUB_SHA=${{ github.sha }}
      runs-on:
        type: string
        required: false
        default: "ubuntu-latest"
      continue-on-security-error:
        description: "Continue on security check errors"
        required: false
        type: boolean
        default: false
      submodules:
        description: "Whether to checkout submodules. Use 'recursive' for repos whose Docker build needs submodules."
        required: false
        type: string
        default: "false"
    secrets:
      CI_REPO_READ_TOKEN:
        description: "Token used to checkout private submodules when submodules are enabled"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "Docker Build"
    runs-on: ${{ inputs['runs-on'] }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}
          submodules: ${{ inputs.submodules }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker Build Cache Key
        id: cachekey
        run: |
            BRANCH_NAME=$(echo "${GITHUB_REF}" | sed 's|refs/heads/||')
            BRANCH_HASH=$(echo -n "$BRANCH_NAME" | sha1sum | awk '{print $1}')
            echo "CACHE_KEY=branch-$BRANCH_HASH" >> $GITHUB_ENV
            echo $CACHE_KEY

      - name: Cache Docker cache mounts
        id: cache-mounts
        uses: actions/cache@v6
        with:
          path: docker-cache-mounts
          key: docker-cache-mounts-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('Dockerfile', '**/Cargo.lock', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/go.sum') }}
          restore-keys: |
            docker-cache-mounts-${{ runner.os }}-${{ github.event.repository.name }}-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: docker-cache-mounts
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Build & push with build args
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ env.CACHE_KEY }}
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ env.CACHE_KEY }},mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          build-args: ${{ inputs.build-args }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: spdx-json
          output-file: "${{ github.event.repository.name }}-sbom.spdx.json"

      - name: Scan image with Grype
        id: scan
        uses: anchore/scan-action@v7
        with:
          cache-db: true
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif
          sbom: "${{ github.event.repository.name }}-sbom.spdx.json"
        continue-on-error: ${{ inputs.continue-on-security-error }}

      - name: Annotate scan vulnerabilities
        if: always()
        env:
          SARIF_FILE: grype-results.sarif
        run: |
          if [[ -z "$SARIF_FILE" || ! -f "$SARIF_FILE" ]]; then
            echo "::warning title=Missing SARIF report::Grype did not produce a SARIF report to annotate."
            exit 0
          fi

          jq -r '.runs[].tool.driver.rules[] |
            "\(.shortDescription.text | split(" ")[1]) \(.id) \(.shortDescription.text)"' \
            "$SARIF_FILE" |
          while read -r line; do
            severity=$(echo "$line" | awk '{print tolower($1)}')
            cve=$(echo "$line" | awk '{print $2}')
            desc=$(echo "$line" | cut -d' ' -f3-)

            # Extract pure CVE ID
            cve_id=$(echo "$cve" | grep -oE 'CVE-[0-9]{4}-[0-9]+')
            link="https://nvd.nist.gov/vuln/detail/$cve_id"

            if [[ "$severity" == "high" || "$severity" == "critical" ]]; then
              echo "::error title=$cve_id::$desc ($link)"
            elif [[ "$severity" == "medium" ]]; then
              echo "::warning title=$cve_id::$desc ($link)"
            else
              echo "::notice title=$cve_id::$desc ($link)"
            fi
          done

      - name: Upload SARIF report
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sarif-report
          path: grype-results.sarif
