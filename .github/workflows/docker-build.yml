on:
  workflow_call:
    inputs:
      build-args:
        type: string
        required: false
        default: |
          GITHUB_SHA=${{ github.sha }}
      runs-on:
        type: string
        required: false
        default: "ubuntu-latest"
      continue-on-security-error:
        description: "Continue on security check errors"
        required: false
        type: boolean
        default: false
      submodules:
        description: "Whether to checkout submodules. Use 'recursive' for repos whose Docker build needs submodules."
        required: false
        type: string
        default: "false"
      dockerfile:
        description: "Path to the Dockerfile (default: Dockerfile). Nested paths publish as <repo>/<dir>."
        required: false
        type: string
        default: "Dockerfile"
      context:
        description: "Docker build context (default: repository root)"
        required: false
        type: string
        default: "."
      image:
        description: "Override GHCR image name under ghcr.io/<owner>/"
        required: false
        type: string
        default: ""
    secrets:
      CI_REPO_READ_TOKEN:
        description: "Token used to checkout private submodules when submodules are enabled"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "Docker Build"
    runs-on: ${{ inputs['runs-on'] }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}
          submodules: ${{ inputs.submodules }}

      - name: Resolve image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          dockerfile="${DOCKERFILE#./}"
          if [ -n "$IMAGE" ]; then
            name="$IMAGE"
          elif [ "$(dirname "$dockerfile")" = "." ]; then
            name="$REPO_NAME"
          else
            name="$REPO_NAME/$(dirname "$dockerfile")"
          fi
          slug="${name//\//-}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${OWNER}/${name}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "cache=ghcr.io/${OWNER}/${name}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prefetch org Grype DB
        env:
          GRYPE_DB_IMAGE: ghcr.io/${{ github.repository_owner }}/grype-db:latest
        run: |
          mkdir -p "$HOME/.cache/grype"
          echo false > "$RUNNER_TEMP/grype-db.hit"
          (
            if docker pull "$GRYPE_DB_IMAGE" && cid=$(docker create "$GRYPE_DB_IMAGE" /db.tar.zst); then
              docker cp "$cid":/db.tar.zst "$RUNNER_TEMP/grype-db.tar.zst"
              docker rm "$cid"
              tar -C "$HOME/.cache/grype" --zstd -xf "$RUNNER_TEMP/grype-db.tar.zst"
              echo true > "$RUNNER_TEMP/grype-db.hit"
            fi
          ) >"$RUNNER_TEMP/grype-db.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/grype-db.pid"

      - name: Build & push with build args
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: |
            ${{ steps.image.outputs.ref }}
          outputs: |
            type=docker
            type=registry
          cache-from: type=registry,ref=${{ steps.image.outputs.cache }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.cache }}:buildcache,mode=max
          build-args: ${{ inputs.build-args }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: docker:${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: "${{ steps.image.outputs.slug }}-sbom.spdx.json"
          config: ${{ hashFiles('syft.yaml') != '' && 'syft.yaml' || '' }}
          upload-artifact: false
          upload-release-assets: false

      - name: Wait for Grype DB
        id: grype-db
        run: |
          pid=$(cat "$RUNNER_TEMP/grype-db.pid")
          while kill -0 "$pid" 2>/dev/null; do
            sleep 1
          done
          cat "$RUNNER_TEMP/grype-db.log" || true
          if [[ "$(cat "$RUNNER_TEMP/grype-db.hit" 2>/dev/null)" == true ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan image with Grype
        id: scan
        uses: anchore/scan-action@v7
        env:
          GRYPE_DB_AUTO_UPDATE: ${{ steps.grype-db.outputs.hit != 'true' }}
        with:
          cache-db: false
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype-results.sarif
          sbom: "${{ steps.image.outputs.slug }}-sbom.spdx.json"
        continue-on-error: ${{ inputs.continue-on-security-error }}

      - name: Annotate scan vulnerabilities
        if: always()
        continue-on-error: ${{ inputs.continue-on-security-error }}
        env:
          SARIF_FILE: grype-results.sarif
        run: |
          if [[ -z "$SARIF_FILE" || ! -f "$SARIF_FILE" ]]; then
            echo "::warning title=Missing SARIF report::Grype did not produce a SARIF report to annotate."
            exit 0
          fi

          # Grype shortDescription is "<id> <severity> vulnerability for <pkg> package".
          # Rule ids are "CVE-…-<pkg>" or "GHSA-…-<pkg>". Do not grep under bash -e:
          # a GHSA id with no CVE match used to abort this step before any annotations.
          # Emit critical/high first so those errors sit at the top of the annotation list.
          jq -r '
            [
              .runs[]?.tool.driver.rules[]? |
              (.shortDescription.text // "") as $text |
              ($text | capture("^(?<vuln>\\S+) (?<severity>\\S+)"; "n") // {}) as $m |
              [
                (($m.severity // "unknown") | ascii_downcase),
                ($m.vuln // .id),
                $text
              ]
            ]
            | sort_by({"critical":0,"high":1,"medium":2}[.[0]] // 3)
            | .[] | @tsv
          ' "$SARIF_FILE" |
          while IFS=$'\t' read -r severity vuln desc; do
            [[ -n "$vuln" ]] || continue
            link=""
            if [[ "$vuln" == CVE-* ]]; then
              link="https://nvd.nist.gov/vuln/detail/${vuln}"
            elif [[ "$vuln" == GHSA-* ]]; then
              link="https://github.com/advisories/${vuln}"
            fi
            suffix=""
            [[ -n "$link" ]] && suffix=" (${link})"

            case "$severity" in
              high|critical) echo "::error title=${vuln}::${desc}${suffix}" ;;
              medium)        echo "::warning title=${vuln}::${desc}${suffix}" ;;
              *)             echo "::notice title=${vuln}::${desc}${suffix}" ;;
            esac
          done

      - name: Upload SARIF report
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sarif-report-${{ steps.image.outputs.slug }}
          path: grype-results.sarif
