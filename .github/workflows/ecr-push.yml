on:
  workflow_call:
    inputs:
      account-id:
        type: string
        required: false
        default: "235494777322"
      aws-region:
        type: string
        required: false
        default: "us-east-1"
      environment:
        description: "Deploy environment (prod, sandbox). Defaults from branch: prod → prod, otherwise sandbox."
        required: false
        type: string
      dockerfile:
        description: "Dockerfile used at build time. Nested paths copy <repo>/<dir> from GHCR to ECR."
        required: false
        type: string
        default: "Dockerfile"
      image:
        description: "Override GHCR and ECR image name (default: derived from dockerfile)"
        required: false
        type: string
        default: ""
      tag-environment:
        description: "Also tag the ECR image with the environment name (sandbox/prod)"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  packages: read

env:
  ENVIRONMENT: ${{ inputs.environment || (github.ref == 'refs/heads/prod' && 'prod' || (github.ref == 'refs/heads/main' && 'sandbox' || 'sandbox')) }}

jobs:
  tag_image:
    name: Tag Docker Image
    runs-on: ubuntu-latest
    environment: >-
      ${{
        inputs.environment ||
        (github.ref == 'refs/heads/prod' && 'prod' || (github.ref == 'refs/heads/main' && 'sandbox' || 'sandbox'))
      }}
    steps:
      - name: Resolve image names
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          ACCOUNT_ID: ${{ inputs.account-id }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          dockerfile="${DOCKERFILE#./}"
          if [ -n "$IMAGE" ]; then
            name="$IMAGE"
          elif [ "$(dirname "$dockerfile")" = "." ]; then
            name="$REPO_NAME"
          else
            name="$REPO_NAME/$(dirname "$dockerfile")"
          fi
          echo "ghcr=ghcr.io/${OWNER}/${name}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "ecr=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-session-name: "${{ github.event.repository.name }}-TagImage-${{ env.ENVIRONMENT }}"
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries:  ${{ inputs.account-id }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Copy image from GHCR to ECR
        env:
          TAG_ENVIRONMENT: ${{ inputs.tag-environment }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          GHCR_REF: ${{ steps.image.outputs.ghcr }}
          ECR_URI: ${{ steps.image.outputs.ecr }}
          SHA: ${{ github.sha }}
        run: |
          extra_args=()
          if [ "${TAG_ENVIRONMENT}" = "true" ]; then
            extra_args+=(--tag "${ECR_URI}:${ENVIRONMENT}")
          fi
          docker buildx imagetools create \
            --tag "${ECR_URI}:${SHA}" \
            "${extra_args[@]}" \
            "${GHCR_REF}"
          echo "Pushed ${ECR_URI}:${SHA}"
          if [ "${TAG_ENVIRONMENT}" = "true" ]; then
            echo "Also tagged ${ECR_URI}:${ENVIRONMENT}"
          fi
